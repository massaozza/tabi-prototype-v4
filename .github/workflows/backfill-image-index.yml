name: Backfill image index

# 都道府県×画像有無の索引（prefImageIndexKey）を追加した際、既存の
# Spotはこの索引に登録されていなかった。既存の全Spotを読み直し、
# 索引に登録し直す一回限りのメンテナンス作業。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: project-13109753

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存関係をインストール
        run: npm ci

      - name: 画像索引を一括登録
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: npm run backfill-image-index
