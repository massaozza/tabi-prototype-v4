name: Repair lost drafts

# 一括処理中のslug競合バグ（複数件が同時に同じURLを生成し、片方が
# もう片方を上書きしてしまう）により、「承認済み」と記録されているのに
# 実際にはSpotが失われてしまったOSM候補を検出し、未Reviewの状態に戻す。
# 戻した後は、Bulk approve content ワークフローで再度処理できる。

on:
  workflow_dispatch:
    inputs:
      prefecture:
        description: '都道府県で絞り込む（空欄なら全都道府県が対象）例: Tochigi'
        required: false
        default: ''
      dryRun:
        description: '検出のみ行い、実際には修復しない'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: project-13109753

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存関係をインストール
        run: npm ci

      - name: 検出・修復を実行
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.prefecture }}" ]; then
            ARGS="$ARGS --prefecture=${{ inputs.prefecture }}"
          fi
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "実行: npm run repair-lost-drafts -- $ARGS"
          npm run repair-lost-drafts -- $ARGS
