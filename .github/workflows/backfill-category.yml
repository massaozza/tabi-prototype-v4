name: Backfill category

# OSM一括インポートで作ったSpotは category（表示用カテゴリ）が空のまま
# になっている。canonicalCategory（shrine_temple, museum 等）から
# 既存367件と同じ語彙（Culture & History 等）へ機械的にマッピングして
# 一括で埋める。

on:
  workflow_dispatch:
    inputs:
      prefecture:
        description: '都道府県で絞り込む（空欄なら全都道府県が対象）例: Tochigi'
        required: false
        default: ''
      dryRun:
        description: '対象件数の確認だけ行い、実際には更新しない'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backfill-category:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: project-13109753

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 依存関係をインストール
        run: npm ci

      - name: カテゴリを一括分類
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.prefecture }}" ]; then
            ARGS="$ARGS --prefecture=${{ inputs.prefecture }}"
          fi
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "実行: npm run backfill-category -- $ARGS"
          npm run backfill-category -- $ARGS
